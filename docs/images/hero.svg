<text x="64" y="188" fill="#f3f4e8" font-size="62" font-weight="700">读 TXT，不必先付费。</text>
<text x="68" y="249" fill="#d0dfb7" font-size="29">背景自由换，字号随心调，故事慢慢读。</text>
<text x="68" y="300" fill="#a8c0b0" font-size="20">给 Mac 和 Windows，一个好看、舒服的本地阅读器。</text>
